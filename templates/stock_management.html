<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stock Management - Super Seatings</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Same look as Manage Accounts and the System panel: light page, white rounded panels, blue buttons, small pills. */
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #132238;
            --muted: #5d6b82;
            --border: #d9e2ec;
            --success-bg: #e8f5e9;
            --success-text: #276749;
            --error-bg: #fdecea;
            --error-text: #b42318;
            --warn-bg: #fff7e6;
            --warn-text: #92400e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(31, 111, 235, 0.14), transparent 24%),
                radial-gradient(circle at top right, rgba(20, 184, 166, 0.12), transparent 20%),
                var(--bg);
        }
        .page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 40px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 14px 40px rgba(19, 34, 56, 0.08); margin-bottom: 16px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: 8px; z-index: 40; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(19, 34, 56, 0.08); }
        .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .link-button { padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; color: var(--accent); font-size: 14px; font-weight: 700; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; cursor: pointer; min-height: 44px; }
        .link-button:hover { background: #eef2f7; }
        .role-indicator { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); padding: 0 2px; }
        h1 { margin: 0 0 6px; font-size: 24px; }
        .muted { color: var(--muted); font-size: 13px; }
        label { font-weight: 700; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px; }
        label.inline { display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--text); margin: 0; }
        input, button, select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; min-height: 44px; }
        input, select { background: #fff; color: var(--text); max-width: 100%; }
        input[type=text].wide { width: 100%; }
        input[type=checkbox] { width: 24px; height: 24px; min-height: 0; padding: 0; accent-color: var(--accent); flex: 0 0 auto; }
        button { background: var(--accent); color: #fff; border: 0; cursor: pointer; font-weight: 700; }
        button.secondary { background: #e8eef7; color: var(--text); }
        button.btn-delete { background: #dc2626; color: #fff; }
        button:disabled { opacity: 0.5; cursor: default; }
        .notice { display: none; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
        #msg { position: sticky; top: 74px; z-index: 30; }
        .notice.success { display: block; color: var(--success-text); background: var(--success-bg); }
        .notice.error { display: block; color: var(--error-text); background: var(--error-bg); }
        .notice.info { display: block; color: var(--warn-text); background: var(--warn-bg); }

        /* section switcher: the same pills as Train Matches' queue tabs */
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .tabs button { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
        .tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tabs .count { min-width: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; line-height: 20px; background: #e8eef7; color: var(--text); text-align: center; }
        .tabs button[aria-selected=true] .count { background: rgba(255, 255, 255, 0.25); color: #fff; }
        .tabs .count.hot { background: #dc2626; color: #fff; }
        .tabs .count:empty { display: none; }

        /* stat cards: the same as the Usage Charts cards */
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .tile { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: #f8fafd; color: var(--text); text-align: left; display: block; min-height: 0; font-weight: 400; }
        .tile b { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; }
        .tile span { display: block; font-size: 12px; color: var(--muted); }
        .tile[aria-pressed=true] { border-color: var(--accent); background: #eef4ff; }
        .tile.urgent b { color: #b91c1c; }
        .tile.soon b { color: #b45309; }
        .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .search { display: flex; gap: 8px; flex: 1 1 240px; min-width: 0; }
        .search .field { position: relative; flex: 1 1 auto; min-width: 0; }
        .search .field input { width: 100%; padding-right: 48px; }
        .search .clear { position: absolute; right: 2px; top: 0; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
        .search .clear:hover { color: var(--text); }

        /* one car's items: a header row, then one row per item like the accounts table */
        .bin { border: 1px solid var(--border); border-radius: 12px; background: #fff; margin-bottom: 10px; overflow: hidden; }
        .bin > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; min-height: 52px; background: #f8fafd; }
        .bin > summary::-webkit-details-marker { display: none; }
        .bin > summary .caret { flex: 0 0 auto; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); }
        .bin[open] > summary .caret { transform: rotate(45deg); }
        .bin .car { flex: 1 1 auto; min-width: 0; }
        .bin .car b { display: block; font-size: 15px; overflow-wrap: anywhere; }
        .bin .car span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
        .item { padding: 12px 14px; border-top: 1px solid var(--border); }
        .item.dim { opacity: 0.7; }
        .item .name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #eef4ff; color: var(--accent-dark); }
        .chip.good { color: var(--success-text); background: var(--success-bg); }
        .chip.bad { color: var(--error-text); background: var(--error-bg); }
        .chip.warn { color: var(--warn-text); background: var(--warn-bg); }
        .chip.plain { color: #6b7280; background: #f3f4f6; }
        .pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #6b7280; background: #f3f4f6; flex: 0 0 auto; }
        .pill.bad { color: var(--error-text); background: var(--error-bg); }
        .pill.warn { color: var(--warn-text); background: var(--warn-bg); }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
        .actions .grow { flex: 1 1 auto; }
        .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
        .stepper button { width: 44px; padding: 0; border: 0; border-radius: 0; font-size: 20px; background: #e8eef7; color: var(--text); }
        .stepper input { width: 4.2em; border: 0; border-radius: 0; text-align: center; font-weight: 700; -moz-appearance: textfield; }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .bar .grow { flex: 1 1 auto; }
        .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .empty { text-align: center; color: var(--muted); padding: 26px 14px; border: 1px dashed var(--border); border-radius: 12px; font-size: 14px; }
        .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
        .loading { color: var(--muted); padding: 24px 0; text-align: center; }
        .heading { margin: 18px 0 8px; font-size: 16px; font-weight: 700; }
        .heading small { color: var(--muted); font-size: 13px; font-weight: 600; margin-left: 6px; }
        details.note { border: 1px solid var(--border); border-radius: 12px; background: #f8fafd; margin-bottom: 14px; }
        details.note summary { min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
        details.note p { margin: 0; padding: 0 14px 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .fineprint { color: var(--muted); font-size: 12px; margin: 14px 2px 0; line-height: 1.5; }
        details.settings { border: 1px solid var(--border); border-radius: 12px; padding: 2px 14px; margin-top: 14px; background: #fff; }
        details.settings summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
        details.settings .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; padding: 4px 0 12px; }
        textarea.copybox { width: 100%; min-height: 150px; font-size: 14px; border-radius: 10px; border: 1px solid var(--border); padding: 10px; }
        #printSheet { display: none; }
        @media (max-width: 640px) {
            .page { padding: 12px 12px 32px; }
            .topbar { position: sticky; top: 0; margin: -12px -12px 12px; border-radius: 0; border-left: 0; border-right: 0; }
            .panel { padding: 14px; }
            .tabs button { flex: 1 1 calc(50% - 8px); justify-content: center; }
            #msg { top: 62px; }
        }
        @media print { .no-print { display: none !important; } #printSheet { display: block !important; color: #000; background: #fff; font-size: 14pt; white-space: pre-wrap; } body { background: #fff; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar no-print">
        <div class="topbar-left">
            <a href="/" class="link-button" title="Return to the main stock viewer page">Home</a>
            <a href="/train" class="link-button" title="Go to the training mode stock matching page">Train Matches</a>
            <button type="button" id="refreshBtn" class="secondary" title="Reload the latest numbers from the shop's stock updates" aria-label="Refresh">Refresh</button>
        </div>
        <div class="topbar-right">
            <span class="role-indicator">Admin mode</span>
            <a href="/logout" class="link-button" title="Sign out of your account">Logout</a>
        </div>
    </div>
    <div class="panel no-print">
        <h1>Stock management</h1>
        <p class="muted" style="margin:0;">See what needs restocking, build an order list, and follow your orders. Works from the sales the shop sends from Tally and the stock changes this site has recorded.</p>
    </div>
    <div id="msg" class="notice no-print" role="status" aria-live="polite"></div>
    <div class="tabs no-print" role="tablist" id="tabs" aria-label="Stock Management sections">
        <button type="button" role="tab" data-tab="needs" title="Needs restocking: designs that are sold out, down to their last piece, or in cars with few designs left">Needs restocking <span class="count" data-count="needs"></span></button>
        <button type="button" role="tab" data-tab="order" title="Order list: what you plan to buy. Copy it to WhatsApp, print it or mark it as ordered">Order list <span class="count" data-count="order"></span></button>
        <button type="button" role="tab" data-tab="ordered" title="Ordered: orders you have placed, with expected dates and overdue warnings">Ordered <span class="count" data-count="ordered"></span></button>
        <button type="button" role="tab" data-tab="slow" title="Slow stock: items in stock that have not sold for a long time">Slow stock <span class="count" data-count="slow"></span></button>
    </div>
    <div id="banner" class="notice info no-print" role="status"></div>
    <div class="panel no-print"><div id="panel"></div></div>
    <details class="note no-print" id="salesBox" title="What the shop has sent from Tally about sales. Open it to see the latest status.">
        <summary>Sales data</summary>
        <div style="padding:0 14px 14px">
            <div id="salesBody" class="muted">No sales data received yet.</div>
            <div class="actions"><button type="button" id="salesReset" class="secondary" style="display:none" title="Forget which Tally company the sales data belongs to. The data stays; the next sales push sets a new company.">Reset company pin</button></div>
        </div>
    </details>
    <div id="printSheet"></div>
</div>
<script>
(function () {
    "use strict";
    var BASE = "/admin/stock_mgmt";
    var tabNames = ["needs", "order", "ordered", "slow"];
    var current = "needs";
    var ui = { needs: { view: "sold", q: "", cars: 30, thinPages: 1 }, slow: { days: 60, q: "", page: 1 }, ordered: { page: 1 }, open: {} };
    var panel = document.getElementById("panel");
    var banner = document.getElementById("banner");
    var toast = document.getElementById("msg");
    var loadCount = 0;
    var orderCount = 0;

    function el(tag, attrs, kids) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (key) {
            var value = attrs[key];
            if (key === "text") { node.textContent = value; }
            else if (key === "class") { node.className = value; }
            else if (key.indexOf("on") === 0) { node.addEventListener(key.slice(2), value); }
            else if (value === true) { node.setAttribute(key, ""); }
            else if (value !== false && value !== null && value !== undefined) { node.setAttribute(key, value); }
        });
        (kids || []).forEach(function (kid) { if (kid) { node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid); } });
        return node;
    }
    function say(text, bad) { toast.textContent = text; toast.className = "notice no-print " + (bad ? "error" : "success"); }
    function quiet() { toast.className = "notice no-print"; toast.textContent = ""; }
    function qs(params) {
        return Object.keys(params).filter(function (k) { return params[k] !== "" && params[k] !== null && params[k] !== undefined; })
            .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    }
    async function getData(params, path) {
        var response = await fetch(BASE + (path || "/data") + "?" + qs(params), { cache: "no-store", credentials: "same-origin" });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        if (!response.ok) { throw new Error(data.error || "Could not load. Please try again."); }
        return data;
    }
    async function send(path, body) {
        var response = await fetch(BASE + path, { method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        return { ok: response.ok, status: response.status, data: data };
    }
    function when(iso) {
        if (!iso) { return ""; }
        var p = iso.split("-");
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return parseInt(p[2], 10) + " " + months[parseInt(p[1], 10) - 1] + " " + p[0];
    }
    function chip(text, kind, hint) { return el("span", { class: "chip" + (kind ? " " + kind : ""), text: text, title: hint || text }); }
    function setBanner(tracking) {
        banner.textContent = tracking.banner || "";
        banner.className = "notice no-print " + (tracking.stock_days >= 7 ? "success" : "info");
        banner.style.position = "static";
        banner.title = "How long the site has been recording stock changes. Estimates are only as good as this history.";
    }
    function setCount(tab, value, hot) {
        var node = document.querySelector('[data-count="' + tab + '"]');
        if (!node) { return; }
        node.textContent = value ? String(value) : "";
        node.className = "count" + (hot ? " hot" : "");
    }
    async function refreshCounts() {
        try {
            var parts = await Promise.all([getData({ tab: "needs", section: "sold" }), getData({ tab: "order" }), getData({ tab: "ordered" })]);
            setCount("needs", parts[0].totals.sold, parts[0].totals.sold > 0);
            orderCount = parts[1].total_items;
            setCount("order", orderCount, false);
            var late = parts[2].open.filter(function (o) { return o.overdue; }).length;
            setCount("ordered", parts[2].total, late > 0);
        } catch (error) { /* the counts are only a convenience */ }
    }
    function note(title, text) { return el("details", { class: "note", title: "Tap to read how this page works" }, [el("summary", { text: title }), el("p", { text: text })]); }
    function emptyState(title, text) { return el("div", { class: "empty" }, [el("strong", { text: title }), text]); }
    function moreButton(data, onMore, label) {
        return data.more ? el("button", { type: "button", text: label || "Show more", onclick: onMore, style: "width:100%;margin-top:6px", title: "Load the next 100" }) : null;
    }
    function searchBox(value, onSearch, placeholder, hint) {
        var input = el("input", { type: "text", value: value, placeholder: placeholder || "Search by name", maxlength: "80", "aria-label": "Search", enterkeyhint: "search", title: hint || "Type part of a name, then press Search" });
        var clear = el("button", { type: "button", class: "clear", text: "\u00d7", title: "Clear the search and show everything again", "aria-label": "Clear search" });
        clear.style.display = value ? "" : "none";
        clear.addEventListener("click", function () {
            input.value = "";
            clear.style.display = "none";
            if (value) { onSearch(""); } else { input.focus(); }
        });
        input.addEventListener("input", function () { clear.style.display = input.value ? "" : "none"; });
        input.addEventListener("keydown", function (event) { if (event.key === "Enter") { onSearch(input.value.trim()); } });
        return el("div", { class: "search" }, [el("div", { class: "field" }, [input, clear]),
            el("button", { type: "button", class: "secondary", text: "Search", title: "Search the list", onclick: function () { onSearch(input.value.trim()); } })]);
    }
    function stepper(initial, label, hint) {
        var input = el("input", { type: "number", min: "1", max: "100000", step: "1", inputmode: "numeric", value: String(initial), "aria-label": label || "Quantity", title: hint || "How many to order" });
        function bump(delta) { var n = parseInt(input.value, 10); input.value = String(Math.max(1, Math.min(100000, (isNaN(n) ? 1 : n) + delta))); input.dispatchEvent(new Event("change")); }
        var box = el("div", { class: "stepper" }, [el("button", { type: "button", text: "−", "aria-label": "One less", title: "One less", onclick: function () { bump(-1); } }), input,
            el("button", { type: "button", text: "+", "aria-label": "One more", title: "One more", onclick: function () { bump(1); } })]);
        return { box: box, input: input };
    }
    function itemActions(row) {
        var qty = stepper(row.suggested_qty, "Quantity to order", "Suggested from recent sales: enough for the 'order cover' days in Settings. Change it if you like.");
        var primary = el("button", { type: "button", class: row.on_order_list ? "secondary" : "", text: row.on_order_list ? "✓ On list - update" : "Add to order list",
            title: row.on_order_list ? "Already on your order list. Tap to save a changed quantity." : "Put this item on your order list with this quantity" });
        var remove = el("button", { type: "button", class: "btn-delete", text: "Remove from list", title: "Take this item off your order list", style: row.on_order_list ? "" : "display:none" });
        primary.addEventListener("click", async function () {
            primary.disabled = true;
            var result = await send("/draft", { action: "add", item_name: row.item_name, qty: parseInt(qty.input.value, 10) });
            primary.disabled = false;
            if (result.ok) {
                say(row.item_name + " is on the order list.");
                primary.textContent = "✓ On list - update"; primary.className = "secondary"; remove.style.display = "";
                primary.title = "Already on your order list. Tap to save a changed quantity.";
                refreshCounts();
            } else { say(result.data.error || "Could not add.", true); }
        });
        remove.addEventListener("click", async function () {
            remove.disabled = true;
            var result = await send("/draft", { action: "remove", item_key: row.item_key });
            remove.disabled = false;
            if (result.ok) {
                say(row.item_name + " was taken off the order list.");
                primary.textContent = "Add to order list"; primary.className = ""; remove.style.display = "none";
                primary.title = "Put this item on your order list with this quantity";
                refreshCounts();
            } else { say(result.data.error || "Could not remove.", true); }
        });
        return el("div", { class: "actions" }, [qty.box, primary, remove]);
    }
    function orderChip(order) { return order ? chip("Ordered " + when(order.ordered_on), "plain", "You already placed an order for this on " + when(order.ordered_on)) : null; }

    // ---------------- needs restocking: sold-out designs, last pieces, cars running thin
    function soldText(row) { return "sold " + row.sold + " in the last " + row.window_days + " days"; }
    function soldRow(row) {
        var chips = [row.sold_out_since ? chip("sold out since " + when(row.sold_out_since), "bad", "The day this site saw the design reach zero in stock") : chip("sold out", "bad", "Not in stock now"),
            row.sold > 0 ? chip(soldText(row), "plain", "Units sold minus units returned in this period, from the shop's sales") : chip("went to zero recently", "plain", "No sales are recorded for it yet, but its stock dropped to zero recently"),
            row.last_sold ? chip("last sold " + when(row.last_sold), "plain", "Date of the most recent sale") : null, orderChip(row.open_order)];
        return el("div", { class: "item" + (row.open_order ? " dim" : "") }, [el("div", { class: "name", text: row.item_name }), el("div", { class: "chips" }, chips), itemActions(row)]);
    }
    function lastRow(row) {
        var chips = [chip("only 1 left", "warn", "One piece is left in stock"), chip(soldText(row), "plain", "Units sold minus units returned in this period, from the shop's sales"),
            row.last_sold ? chip("last sold " + when(row.last_sold), "plain", "Date of the most recent sale") : null, orderChip(row.open_order)];
        return el("div", { class: "item" + (row.open_order ? " dim" : "") }, [el("div", { class: "name", text: row.item_name }), el("div", { class: "chips" }, chips), itemActions(row)]);
    }
    function groupsOf(rows) {
        var groups = [], index = {};
        rows.forEach(function (row) {
            if (!(row.car in index)) { index[row.car] = groups.length; groups.push({ car: row.car, rows: [] }); }
            groups[index[row.car]].rows.push(row);
        });
        return groups;
    }
    function bin(view, group) {
        var id = view + "|" + group.car;
        var isOpen = ui.open[id] === true;      // every car starts closed

                parts.push(el("div", { class: "bin" }, [el("div", { class: "item" }, [el("div", { class: "name", text: row.item_name }),
                    el("div", { class: "chips" }, [chip(row.qty + " in stock", "plain", "Quantity in stock now"), chip("sitting " + row.days_sitting + " days", "warn", "Days since the quantity last went down, or since it came into stock"),
                        chip(row.last_decrease ? "last sold " + when(row.last_decrease) : (data.source === "sales" ? "no sale in the sales history" : "no sale since tracking began"), "plain", data.source === "sales" ? "Date of the most recent sale" : "Date the quantity last went down")])])]));
            });
            var more = moreButton(data, function () { s.page += 1; load(); });
            if (more) { parts.push(more); }
        }
        parts.push(el("p", { class: "fineprint", text: "Estimates only. A quiet item may simply be seasonal or kept for a regular customer. Think before you discount or stop reordering." }));
        panel.replaceChildren.apply(panel, parts);
    }

    // ---------------- sales data box
    async function loadSales() {
        var body = document.getElementById("salesBody"), reset = document.getElementById("salesReset");
        try {
            var data = await getData({}, "/sales_status");
            if (!data.has_data) {
                body.textContent = data.company_pin ? "The shop has registered a Tally company but no sales lines are stored." : "No sales data received yet.";
            } else {
                var months = data.months.map(function (m) { return el("tr", {}, [el("td", { text: m.month }), el("td", { text: String(m.vouchers) }), el("td", { text: String(m.sold) }), el("td", { text: String(m.returned) }), el("td", { text: String(m.net) })]); });
                body.replaceChildren(
                    el("div", { text: "Last update " + (data.last_sync_ist || "unknown") + " (covering " + when(data.last_from) + " to " + when(data.last_to) + ")." }),
                    el("div", { text: "Days stored: " + when(data.first_day) + " to " + when(data.last_day) + ". " + data.total_lines + " lines, " + data.vouchers + " sales slips, " + data.items + " designs." }),
                    el("table", { style: "margin-top:8px;border-collapse:collapse;font-size:13px", title: "Units sold, returned and net, by month" }, [
                        el("tr", {}, ["Month", "Slips", "Sold", "Returned", "Net"].map(function (h) { return el("th", { text: h, style: "text-align:left;padding:2px 10px 2px 0" }); }))].concat(months)),
                    data.unmatched_count ? el("div", { class: "meta", title: "Sold design names that match no catalogue or stock item. These cannot be linked to a car.",
                        text: data.unmatched_count + " sold design" + (data.unmatched_count === 1 ? "" : "s") + " match no item in the catalogue, for example: " + data.unmatched_samples.slice(0, 5).join(", ") + (data.unmatched_count > 5 ? ", \u2026" : "") }) : el("div", { class: "meta", text: "Every sold design matches the catalogue." }));
            }
            reset.style.display = data.company_pin ? "" : "none";
            if (data.company_pin) { reset.textContent = "Reset company pin"; reset.title = "Forget which Tally company the sales data belongs to (pin " + data.company_pin + "). The data stays; the next sales push sets a new company."; }
        } catch (error) { body.textContent = error.message || "Could not load the sales data."; }
    }
    document.getElementById("salesBox").addEventListener("toggle", function (event) { if (event.target.open) { loadSales(); } });
    document.getElementById("salesReset").addEventListener("click", async function () {
        if (!window.confirm("Reset the company pin? The next sales push will set a new one. The stored sales data stays.")) { return; }
        var result = await send("/sales_reset_company", { confirm: "RESET" });
        if (result.ok) { say("Company pin reset."); loadSales(); } else { say(result.data.error || "Could not reset.", true); }
    });

    var renderers = { needs: renderNeeds, order: renderOrder, ordered: renderOrdered, slow: renderSlow };
    async function load() {
        var ticket = ++loadCount;
        if (!panel.firstChild) { panel.appendChild(el("div", { class: "loading", text: "Loading…" })); }
        try {
            await renderers[current]();
            if (ticket === loadCount) { quiet(); }
            refreshCounts();
        } catch (error) {
            say(error.message || "Could not load. Please try again.", true);
        }
    }
    function select(tab) {
        current = tab;
        Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (button) {
            button.setAttribute("aria-selected", button.getAttribute("data-tab") === tab ? "true" : "false");
        });
        try { window.location.hash = tab; } catch (error) { /* ignore */ }
        panel.replaceChildren();
        window.scrollTo(0, 0);
        load();
    }
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (button) {
        button.addEventListener("click", function () { select(button.getAttribute("data-tab")); });
    });
    document.getElementById("refreshBtn").addEventListener("click", function () { load(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) { load(); } });
    var start = (window.location.hash || "").replace("#", "");
    select(tabNames.indexOf(start) >= 0 ? start : "needs");
})();
</script>
</body>
</html>
