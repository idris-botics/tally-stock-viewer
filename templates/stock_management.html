<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stock Management - Super Seatings</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --ink: #101828;
            --muted: #4b5a6e;
            --line: #d5dde6;
            --action: #0b6f78;
            --action-ink: #ffffff;
            --action-soft: #dff3f4;
            --urgent: #c4122f;
            --urgent-soft: #fde8ec;
            --soon: #b36b00;
            --soon-soft: #fff1d1;
            --fine: #1b7f55;
            --fine-soft: #def4e9;
            --shadow: 0 1px 2px rgba(16, 24, 40, .08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d141d;
                --panel: #16202c;
                --ink: #eaf0f7;
                --muted: #a3b3c7;
                --line: #2a3a4e;
                --action: #4cc3cc;
                --action-ink: #06262a;
                --action-soft: #12383d;
                --urgent: #ff7d8f;
                --urgent-soft: #45171f;
                --soon: #ffc15e;
                --soon-soft: #3d3014;
                --fine: #62d49a;
                --fine-soft: #173a2b;
                --shadow: none;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 130px; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 18px; line-height: 1.4; color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; }
        .page { max-width: 820px; margin: 0 auto; padding: 0 14px 130px; }
        button, input, select, textarea, summary { font: inherit; }
        :focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

        /* top bar */
        .topbar { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 8px; padding: 10px 0; background: var(--bg); }
        .topbar h1 { flex: 1 1 auto; margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
        .btn, button { min-height: 48px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--action); font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(.98); }
        button.primary { background: var(--action); border-color: var(--action); color: var(--action-ink); }
        button.good { background: var(--fine-soft); border-color: var(--fine); color: var(--fine); }
        button.danger { color: var(--urgent); }
        button.ghost { background: transparent; border-color: transparent; }
        button:disabled { opacity: .45; cursor: default; transform: none; }

        /* banner and notices */
        .banner { border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-weight: 600; font-size: 16px; background: var(--soon-soft); color: var(--soon); }
        .banner.calm { background: var(--fine-soft); color: var(--fine); }
        .note { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
        .note summary { min-height: 48px; display: flex; align-items: center; padding: 0 14px; font-weight: 700; cursor: pointer; }
        .note p { margin: 0; padding: 0 14px 14px; color: var(--muted); font-size: 16px; }
        .fineprint { color: var(--muted); font-size: 15px; margin: 18px 2px 0; }
        .toast { position: fixed; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 40; max-width: 640px; margin: 0 auto; padding: 12px 16px; border-radius: 14px; font-weight: 700; display: none; box-shadow: 0 6px 24px rgba(16, 24, 40, .28); }
        .toast.ok { display: block; background: var(--fine); color: #fff; }
        .toast.err { display: block; background: var(--urgent); color: #fff; }
        @media (prefers-color-scheme: dark) { .toast.ok, .toast.err { color: #06120c; } }

        /* bottom tab bar (phones) / top pills (wide) */
        .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
        .tabs button { flex: 1 1 0; min-width: 0; min-height: 58px; padding: 4px 2px; flex-direction: column; gap: 2px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 14px; position: relative; }
        .tabs button[aria-selected=true] { background: var(--action-soft); color: var(--action); }
        .tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .tabs .count { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 20px; padding: 0 5px; border-radius: 999px; font-size: 12px; font-weight: 800; line-height: 20px; background: var(--ink); color: var(--bg); }
        .tabs .count.hot { background: var(--urgent); color: #fff; }
        .tabs .count:empty { display: none; }
        @media (min-width: 760px) {
            .page { padding-bottom: 40px; }
            .tabs { position: sticky; top: 64px; bottom: auto; z-index: 24; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; padding: 6px; }
            .tabs button { flex-direction: row; font-size: 17px; min-height: 48px; }
            .tabs .count { position: static; }
            .toast { bottom: 24px; }
        }

        /* summary tiles and segmented control */
        .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .tile { display: block; text-align: left; min-height: 0; padding: 10px 12px; border-radius: 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
        .tile b { display: block; font-size: 28px; line-height: 1.1; }
        .tile span { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
        .tile.urgent b { color: var(--urgent); }
        .tile.soon b { color: var(--soon); }
        .tile[aria-pressed=true] { border-color: var(--action); box-shadow: 0 0 0 2px var(--action); }
        .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        .search { display: flex; gap: 8px; flex: 1 1 240px; min-width: 0; }
        .search input { flex: 1 1 auto; min-width: 0; }
        .switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; min-height: 48px; }

        /* car bins (groups) */
        .bin { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
        .bin > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 14px; cursor: pointer; }
        .bin > summary::-webkit-details-marker { display: none; }
        .bin > summary .caret { flex: 0 0 auto; width: 12px; height: 12px; border-right: 3px solid var(--muted); border-bottom: 3px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
        .bin[open] > summary .caret { transform: rotate(45deg); }
        .bin .car { flex: 1 1 auto; min-width: 0; }
        .bin .car b { display: block; font-size: 19px; overflow-wrap: anywhere; line-height: 1.2; }
        .bin .car span { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
        .bin .pill { flex: 0 0 auto; }
        .bin.urgent { border-left: 6px solid var(--urgent); }
        .bin.soon { border-left: 6px solid var(--soon); }
        .bin.fine { border-left: 6px solid var(--fine); }
        .bin .inner { border-top: 1px solid var(--line); }

        /* item rows */
        .item { padding: 12px 14px; border-top: 1px solid var(--line); }
        .item:first-child { border-top: 0; }
        .item.dim { opacity: .68; }
        .item .name { font-weight: 800; font-size: 18px; overflow-wrap: anywhere; line-height: 1.25; }
        .gauge { height: 10px; border-radius: 999px; background: var(--line); margin: 10px 0 6px; overflow: hidden; }
        .gauge i { display: block; height: 100%; border-radius: 999px; background: var(--fine); }
        .gauge.urgent i { background: var(--urgent); }
        .gauge.soon i { background: var(--soon); }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--action-soft); color: var(--action); }
        .chip.bad { background: var(--urgent-soft); color: var(--urgent); }
        .chip.warn { background: var(--soon-soft); color: var(--soon); }
        .chip.good { background: var(--fine-soft); color: var(--fine); }
        .chip.plain { background: var(--line); color: var(--ink); }
        .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 10px; border-radius: 999px; font-weight: 800; font-size: 16px; background: var(--line); color: var(--ink); }
        .pill.bad { background: var(--urgent); color: #fff; }
        .pill.warn { background: var(--soon); color: #fff; }
        @media (prefers-color-scheme: dark) { .pill.bad, .pill.warn { color: #190a0d; } }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
        .actions .grow { flex: 1 1 auto; }
        .meta { color: var(--muted); font-size: 16px; margin-top: 4px; }
        .empty { text-align: center; color: var(--muted); padding: 30px 14px; background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; }
        .empty strong { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }
        .loading { color: var(--muted); padding: 28px 0; text-align: center; }
        .heading { margin: 20px 0 8px; font-size: 19px; font-weight: 800; }
        .heading small { color: var(--muted); font-size: 15px; font-weight: 600; margin-left: 6px; }

        /* inputs */
        input[type=number], input[type=text], input[type=date], select { min-height: 48px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); max-width: 100%; }
        input[type=text].wide { width: 100%; }
        input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--action); flex: 0 0 auto; }
        .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
        .stepper button { min-height: 48px; width: 48px; padding: 0; border: 0; border-radius: 0; font-size: 24px; background: var(--action-soft); color: var(--action); }
        .stepper input { width: 4.4em; border: 0; border-radius: 0; text-align: center; font-weight: 800; -moz-appearance: textfield; }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        details.settings { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; margin-top: 18px; }
        details.settings summary { min-height: 48px; display: flex; align-items: center; font-weight: 800; cursor: pointer; }
        details.settings .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; padding: 4px 0 12px; }
        details.settings label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 16px; color: var(--muted); }
        .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
        .bar .grow { flex: 1 1 auto; }
        textarea.copybox { width: 100%; min-height: 160px; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px; }
        .jump { position: fixed; right: 14px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 35; min-height: 52px; border-radius: 999px; background: var(--action); border-color: var(--action); color: var(--action-ink); box-shadow: 0 6px 20px rgba(16, 24, 40, .3); display: none; }
        .jump.show { display: inline-flex; }
        @media (min-width: 760px) { .jump { bottom: 24px; } }
        #printSheet { display: none; }
        @media print { .no-print { display: none !important; } #printSheet { display: block !important; color: #000; background: #fff; font-size: 14pt; white-space: pre-wrap; } body { background: #fff; } }
        @media (prefers-reduced-motion: reduce) { button:active { transform: none; } .bin > summary .caret { transition: none; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar no-print">
        <a class="btn" href="/" title="Go back to the stock page" aria-label="Back to the stock page">&larr; Back</a>
        <h1>Stock Management</h1>
        <button type="button" id="refreshBtn" title="Reload the latest numbers from the shop's stock updates" aria-label="Refresh">&#8635; Refresh</button>
    </div>
    <div id="banner" class="banner no-print" role="status"></div>
    <div id="panel" class="no-print"></div>
    <div id="printSheet"></div>
</div>
<div id="msg" class="toast no-print" role="status" aria-live="polite"></div>
<button type="button" id="jumpBtn" class="jump no-print" title="Go to the order list you are building">Order list</button>
<nav class="tabs no-print" role="tablist" id="tabs" aria-label="Stock Management sections">
    <button type="button" role="tab" data-tab="needs" title="Needs restocking: items that are running low or sold out, grouped by car">
        <span class="count" data-count="needs"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>Restock</button>
    <button type="button" role="tab" data-tab="order" title="Order list: what you plan to buy. Copy it to WhatsApp, print it or mark it as ordered">
        <span class="count" data-count="order"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 6H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-2"/><path d="M9 12h6M9 16h6"/></svg>Order list</button>
    <button type="button" role="tab" data-tab="ordered" title="Ordered: orders you have placed, with expected dates and overdue warnings">
        <span class="count" data-count="ordered"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/></svg>Ordered</button>
    <button type="button" role="tab" data-tab="slow" title="Slow stock: items in stock that have not sold for a long time">
        <span class="count" data-count="slow"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg>Slow stock</button>
</nav>
<script>
(function () {
    "use strict";
    var BASE = "/admin/stock_mgmt";
    var tabNames = ["needs", "order", "ordered", "slow"];
    var current = "needs";
    var ui = { needs: { view: "low", showAll: false, q: "", lowPages: 1, outPages: 1 }, slow: { days: 60, q: "", page: 1 }, ordered: { page: 1 }, open: {}, allOpen: null };
    var panel = document.getElementById("panel");
    var banner = document.getElementById("banner");
    var toast = document.getElementById("msg");
    var jump = document.getElementById("jumpBtn");
    var loadCount = 0;
    var orderCount = 0;

    function el(tag, attrs, kids) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (key) {
            var value = attrs[key];
            if (key === "text") { node.textContent = value; }
            else if (key === "class") { node.className = value; }
            else if (key.indexOf("on") === 0) { node.addEventListener(key.slice(2), value); }
            else if (value === true) { node.setAttribute(key, ""); }
            else if (value !== false && value !== null && value !== undefined) { node.setAttribute(key, value); }
        });
        (kids || []).forEach(function (kid) { if (kid) { node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid); } });
        return node;
    }
    function say(text, bad) { toast.textContent = text; toast.className = "toast no-print " + (bad ? "err" : "ok"); }
    function quiet() { toast.className = "toast no-print"; toast.textContent = ""; }
    function qs(params) {
        return Object.keys(params).filter(function (k) { return params[k] !== "" && params[k] !== null && params[k] !== undefined; })
            .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    }
    async function getData(params) {
        var response = await fetch(BASE + "/data?" + qs(params), { cache: "no-store", credentials: "same-origin" });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        if (!response.ok) { throw new Error(data.error || "Could not load. Please try again."); }
        return data;
    }
    async function send(path, body) {
        var response = await fetch(BASE + path, { method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        return { ok: response.ok, status: response.status, data: data };
    }
    function when(iso) {
        if (!iso) { return ""; }
        var p = iso.split("-");
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return parseInt(p[2], 10) + " " + months[parseInt(p[1], 10) - 1] + " " + p[0];
    }
    function chip(text, kind, hint) { return el("span", { class: "chip" + (kind ? " " + kind : ""), text: text, title: hint || text }); }
    function setBanner(tracking) {
        banner.textContent = tracking.banner || "";
        banner.className = "banner no-print" + (tracking.stock_days >= 7 ? " calm" : "");
        banner.title = "How long the site has been recording stock changes. Estimates are only as good as this history.";
    }
    function setCount(tab, value, hot) {
        var node = document.querySelector('[data-count="' + tab + '"]');
        if (!node) { return; }
        node.textContent = value ? String(value) : "";
        node.className = "count" + (hot ? " hot" : "");
    }
    async function refreshCounts() {
        try {
            var parts = await Promise.all([getData({ tab: "needs", section: "low" }), getData({ tab: "order" }), getData({ tab: "ordered" })]);
            setCount("needs", parts[0].total, parts[0].total > 0);
            orderCount = parts[1].total_items;
            setCount("order", orderCount, false);
            var late = parts[2].open.filter(function (o) { return o.overdue; }).length;
            setCount("ordered", parts[2].total, late > 0);
            jump.className = "jump no-print" + (orderCount > 0 && current === "needs" ? " show" : "");
            jump.textContent = "Order list (" + orderCount + ")";
        } catch (error) { /* the counts are only a convenience */ }
    }
    function note(title, text) { return el("details", { class: "note", title: "Tap to read how this page works" }, [el("summary", { text: title }), el("p", { text: text })]); }
    function emptyState(title, text) { return el("div", { class: "empty" }, [el("strong", { text: title }), text]); }
    function moreButton(data, onMore, label) {
        return data.more ? el("button", { type: "button", text: label || "Show more", onclick: onMore, style: "width:100%;margin-top:6px", title: "Load the next 100" }) : null;
    }
    function searchBox(value, onSearch, placeholder, hint) {
        var input = el("input", { type: "text", value: value, placeholder: placeholder || "Search by name", maxlength: "80", "aria-label": "Search", enterkeyhint: "search", title: hint || "Type part of a name, then press Search" });
        input.addEventListener("keydown", function (event) { if (event.key === "Enter") { onSearch(input.value.trim()); } });
        return el("div", { class: "search" }, [input, el("button", { type: "button", text: "Search", title: "Search the list", onclick: function () { onSearch(input.value.trim()); } })]);
    }
    function stepper(initial, label, hint) {
        var input = el("input", { type: "number", min: "1", max: "100000", step: "1", inputmode: "numeric", value: String(initial), "aria-label": label || "Quantity", title: hint || "How many to order" });
        function bump(delta) { var n = parseInt(input.value, 10); input.value = String(Math.max(1, Math.min(100000, (isNaN(n) ? 1 : n) + delta))); input.dispatchEvent(new Event("change")); }
        var box = el("div", { class: "stepper" }, [el("button", { type: "button", text: "−", "aria-label": "One less", title: "One less", onclick: function () { bump(-1); } }), input,
            el("button", { type: "button", text: "+", "aria-label": "One more", title: "One more", onclick: function () { bump(1); } })]);
        return { box: box, input: input };
    }
    function itemActions(row) {
        var qty = stepper(row.suggested_qty, "Quantity to order", "Suggested from recent sales: enough for the 'order cover' days in Settings. Change it if you like.");
        var primary = el("button", { type: "button", class: row.on_order_list ? "good" : "primary", text: row.on_order_list ? "✓ On list - update" : "Add to order list",
            title: row.on_order_list ? "Already on your order list. Tap to save a changed quantity." : "Put this item on your order list with this quantity" });
        var remove = el("button", { type: "button", class: "danger", text: "Remove from list", title: "Take this item off your order list", style: row.on_order_list ? "" : "display:none" });
        primary.addEventListener("click", async function () {
            primary.disabled = true;
            var result = await send("/draft", { action: "add", item_name: row.item_name, qty: parseInt(qty.input.value, 10) });
            primary.disabled = false;
            if (result.ok) {
                say(row.item_name + " is on the order list.");
                primary.textContent = "✓ On list - update"; primary.className = "good"; remove.style.display = "";
                primary.title = "Already on your order list. Tap to save a changed quantity.";
                refreshCounts();
            } else { say(result.data.error || "Could not add.", true); }
        });
        remove.addEventListener("click", async function () {
            remove.disabled = true;
            var result = await send("/draft", { action: "remove", item_key: row.item_key });
            remove.disabled = false;
            if (result.ok) {
                say(row.item_name + " was taken off the order list.");
                primary.textContent = "Add to order list"; primary.className = "primary"; remove.style.display = "none";
                primary.title = "Put this item on your order list with this quantity";
                refreshCounts();
            } else { say(result.data.error || "Could not remove.", true); }
        });
        return el("div", { class: "actions" }, [qty.box, primary, remove]);
    }
    function orderChip(order) { return order ? chip("Ordered " + when(order.ordered_on), "plain", "You already placed an order for this on " + when(order.ordered_on)) : null; }

    // ---------------- restock: items grouped by car
    function gaugeFor(row, lowDays) {
        // The fuller the bar, the more time is left; red when it is nearly gone.
        var days = row.days_left;

    async function pagesOf(base, count) {

    }

    // ---------------- order list
    function showCopyBox(text) {

    async function copyText(text) {
        try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); say("Copied. You can paste it into WhatsApp."); return; } }
        catch (error) { /* fall through to the older way */ }
        var scratch = el("textarea", { readonly: true, style: "position:fixed;top:0;left:0;opacity:0" });
        scratch.value = text;
        document.body.appendChild(scratch);
        scratch.select(); scratch.setSelectionRange(0, text.length);
        var copied = false;
        try { copied = document.execCommand("copy"); } catch (error) { copied = false; }
        document.body.removeChild(scratch);
        if (copied) { say("Copied. You can paste it into WhatsApp."); } else { showCopyBox(text); say("Could not copy by itself. Select the text and copy it.", true); }
    }
    async function placeOrders(body) {

                result = await send("/orders", Object.assign({ action: "place", confirm_duplicates: true }, body));
            } else { return; }

        if (result.ok) { say("Marked as ordered."); load(); } else { say(result.data.error || "Could not mark as ordered.", true); }
    }
    async function undo() {

    }

            await renderers[current]();

            say(error.message || "Could not load. Please try again.", true);

    function select(tab) {

})();
