<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stock Management - Super Seatings</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #132238;
            --muted: #566680;
            --border: #d3dce8;
            --accent: #1f6feb;
            --accent-dark: #1553b8;
            --accent-soft: #e6efff;
            --good: #1d7a4a;
            --good-soft: #e3f5ea;
            --warn: #b26a00;
            --warn-soft: #fff3d6;
            --bad: #c0281d;
            --bad-soft: #fde9e7;
            --shadow: 0 1px 2px rgba(19, 34, 56, .06), 0 6px 18px rgba(19, 34, 56, .06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1722;
                --panel: #182231;
                --text: #e8eef7;
                --muted: #9db0c9;
                --border: #2b3b52;
                --accent: #5b9bff;
                --accent-dark: #8dbaff;
                --accent-soft: #1d2f4b;
                --good: #5fd08f;
                --good-soft: #17352a;
                --warn: #ffbf55;
                --warn-soft: #3b2f14;
                --bad: #ff8b80;
                --bad-soft: #43201d;
                --shadow: none;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 18px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg);
        }
        .page { max-width: 860px; margin: 0 auto; padding: 12px 14px 110px; }
        button, input, select, textarea { font: inherit; }

        /* ---- header */
        .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .topbar h1 { font-size: 24px; margin: 0; flex: 1 1 auto; letter-spacing: -0.01em; }
        .btn, button {
            min-height: 48px;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--accent-dark);
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(.98); }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        button.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
        button.danger { color: var(--bad); }
        button.ghost { background: transparent; border-color: transparent; }
        button:disabled { opacity: .45; cursor: default; transform: none; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        /* ---- banner, messages */
        .banner { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; font-size: 16px; }
        .banner.calm { background: var(--good-soft); color: var(--good); }
        .msg { position: sticky; top: 8px; z-index: 20; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; font-weight: 700; display: none; box-shadow: var(--shadow); }
        .msg.ok { display: block; background: var(--good-soft); color: var(--good); }
        .msg.err { display: block; background: var(--bad-soft); color: var(--bad); }

        /* ---- tabs: a bar at the bottom on phones, pills at the top on wide screens */
        .tabs { display: flex; gap: 6px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
                background: var(--panel); border-top: 1px solid var(--border); }
        .tabs button { flex: 1 1 0; min-width: 0; flex-direction: column; min-height: 56px; padding: 4px 2px; font-size: 14px; border: 0; background: transparent; color: var(--muted); border-radius: 12px; }
        .tabs button[aria-selected=true] { background: var(--accent-soft); color: var(--accent-dark); }
        .tabs .count { font-size: 13px; font-weight: 800; min-width: 1.6em; padding: 0 6px; border-radius: 999px; background: var(--border); color: var(--text); }
        .tabs .count.hot { background: var(--bad); color: #fff; }
        .tabs .count:empty { display: none; }
        .tabs .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        @media (min-width: 760px) {
            .tabs { position: static; border: 0; background: transparent; padding: 0; margin-bottom: 14px; }
            .tabs button { flex-direction: row; gap: 8px; font-size: 17px; border: 1px solid var(--border); background: var(--panel); min-height: 48px; }
            .tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
            .page { padding-bottom: 40px; }
        }

        /* ---- sections and cards */
        .section { margin-bottom: 18px; }
        .section > h2 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; }
        .section > h2 small { font-size: 15px; color: var(--muted); font-weight: 600; }
        .hint { color: var(--muted); font-size: 16px; margin: 2px 0 10px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-left: 6px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
        .card.urgent { border-left-color: var(--bad); }
        .card.soon { border-left-color: var(--warn); }
        .card.fine { border-left-color: var(--good); }
        .card.dim { opacity: .7; }
        .card .top { display: flex; gap: 10px; align-items: flex-start; }
        .card .name { font-weight: 800; font-size: 19px; overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--accent-soft); color: var(--accent-dark); }
        .chip.bad { background: var(--bad-soft); color: var(--bad); }
        .chip.warn { background: var(--warn-soft); color: var(--warn); }
        .chip.good { background: var(--good-soft); color: var(--good); }
        .chip.plain { background: var(--border); color: var(--text); }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
        .actions .grow { flex: 1 1 auto; }
        .meta { color: var(--muted); font-size: 16px; margin-top: 4px; }
        .empty { text-align: center; color: var(--muted); padding: 28px 12px; background: var(--panel); border: 1px dashed var(--border); border-radius: 16px; }
        .empty strong { display: block; color: var(--text); font-size: 19px; margin-bottom: 4px; }

        /* ---- inputs */
        input[type=number], input[type=text], input[type=date], select {
            min-height: 48px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 12px;
            background: var(--panel); color: var(--text); max-width: 100%;
        }
        input[type=text].wide { width: 100%; }
        input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--accent); flex: 0 0 auto; }
        .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel); }
        .stepper button { min-height: 48px; width: 48px; padding: 0; border: 0; border-radius: 0; font-size: 24px; background: var(--accent-soft); color: var(--accent-dark); }
        .stepper input { width: 4.6em; border: 0; border-radius: 0; text-align: center; font-weight: 800; -moz-appearance: textfield; }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
        .toolbar label { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
        .search { display: flex; gap: 8px; flex: 1 1 260px; }
        .search input { flex: 1 1 auto; min-width: 0; }
        details.settings { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 4px 14px; margin-bottom: 16px; }
        details.settings summary { min-height: 48px; display: flex; align-items: center; font-weight: 800; cursor: pointer; }
        details.settings .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 4px 0 14px; }
        details.settings label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 16px; color: var(--muted); }
        .group-title { margin: 18px 0 8px; font-size: 18px; font-weight: 800; color: var(--accent-dark); text-transform: uppercase; letter-spacing: .04em; }
        .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .bar .grow { flex: 1 1 auto; }
        textarea.copybox { width: 100%; min-height: 160px; font-size: 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 10px; }
        .loading { color: var(--muted); padding: 24px 0; text-align: center; }
        #printSheet { display: none; }
        @media print {
            .no-print { display: none !important; }
            #printSheet { display: block !important; color: #000; background: #fff; font-size: 14pt; white-space: pre-wrap; }
            body { background: #fff; }
        }
        @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar no-print">
        <a class="btn" href="/" aria-label="Back to the stock page">&larr; Back</a>
        <h1>Stock Management</h1>
        <button type="button" id="refreshBtn" aria-label="Refresh">&#8635; Refresh</button>
    </div>
    <div id="banner" class="banner no-print" role="status"></div>
    <div id="msg" class="msg no-print" role="status" aria-live="polite"></div>
    <div id="panel" class="no-print"></div>
    <div id="printSheet"></div>
</div>
<nav class="tabs no-print" role="tablist" id="tabs" aria-label="Stock Management sections">
    <button type="button" role="tab" data-tab="needs"><span class="count" data-count="needs"></span><span class="label">Needs restocking</span></button>
    <button type="button" role="tab" data-tab="order"><span class="count" data-count="order"></span><span class="label">Order list</span></button>
    <button type="button" role="tab" data-tab="ordered"><span class="count" data-count="ordered"></span><span class="label">Ordered</span></button>
    <button type="button" role="tab" data-tab="slow"><span class="count" data-count="slow"></span><span class="label">Slow stock</span></button>
</nav>
<script>
(function () {
    "use strict";
    var BASE = "/admin/stock_mgmt";
    var tabNames = ["needs", "order", "ordered", "slow"];
    var current = "needs";
    var ui = { needs: { showAll: false, q: "", lowPage: 1, outPage: 1 }, slow: { days: 60, q: "", page: 1 }, ordered: { page: 1 } };
    var panel = document.getElementById("panel");
    var banner = document.getElementById("banner");
    var msg = document.getElementById("msg");
    var loadCount = 0;

    function el(tag, attrs, kids) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (key) {
            var value = attrs[key];
            if (key === "text") { node.textContent = value; }
            else if (key === "class") { node.className = value; }
            else if (key.indexOf("on") === 0) { node.addEventListener(key.slice(2), value); }
            else if (value === true) { node.setAttribute(key, ""); }
            else if (value !== false && value !== null && value !== undefined) { node.setAttribute(key, value); }
        });
        (kids || []).forEach(function (kid) { if (kid) { node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid); } });
        return node;
    }
    function say(text, bad) { msg.textContent = text; msg.className = "msg no-print " + (bad ? "err" : "ok"); }
    function quiet() { msg.className = "msg no-print"; msg.textContent = ""; }
    function qs(params) {
        return Object.keys(params).filter(function (k) { return params[k] !== "" && params[k] !== null && params[k] !== undefined; })
            .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    }
    async function getData(params) {
        var response = await fetch(BASE + "/data?" + qs(params), { cache: "no-store", credentials: "same-origin" });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        if (!response.ok) { throw new Error(data.error || "Could not load. Please try again."); }
        return data;
    }
    async function send(path, body) {
        var response = await fetch(BASE + path, { method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        var data = {};
        try { data = await response.json(); } catch (e) { data = {}; }
        return { ok: response.ok, status: response.status, data: data };
    }
    function when(iso) {
        if (!iso) { return ""; }
        var p = iso.split("-");
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return parseInt(p[2], 10) + " " + months[parseInt(p[1], 10) - 1] + " " + p[0];
    }
    function chip(text, kind) { return el("span", { class: "chip" + (kind ? " " + kind : ""), text: text }); }
    function setBanner(tracking) {
        banner.textContent = tracking.banner || "";
        banner.className = "banner no-print" + (tracking.stock_days >= 7 ? " calm" : "");
    }
    function setCount(tab, value, hot) {
        var node = document.querySelector('[data-count="' + tab + '"]');
        if (!node) { return; }
        node.textContent = value ? String(value) : "";
        node.className = "count" + (hot ? " hot" : "");
    }
    async function refreshCounts() {
        try {
            var parts = await Promise.all([getData({ tab: "needs", section: "low" }), getData({ tab: "order" }), getData({ tab: "ordered" })]);
            setCount("needs", parts[0].total, parts[0].total > 0);
            setCount("order", parts[1].total_items, false);
            var late = parts[2].open.filter(function (o) { return o.overdue; }).length;
            setCount("ordered", parts[2].total, late > 0);
        } catch (error) { /* the counts are only a convenience */ }
    }
    function moreButton(data, onMore) {
        return data.more ? el("button", { type: "button", text: "Show more", onclick: onMore, style: "width:100%" }) : null;
    }
    function searchBox(value, onSearch, placeholder) {
        var input = el("input", { type: "text", value: value, placeholder: placeholder || "Search by name", maxlength: "80", "aria-label": "Search", enterkeyhint: "search" });
        input.addEventListener("keydown", function (event) { if (event.key === "Enter") { onSearch(input.value.trim()); } });
        return el("div", { class: "search" }, [input, el("button", { type: "button", text: "Search", onclick: function () { onSearch(input.value.trim()); } })]);
    }
    function emptyState(title, text) { return el("div", { class: "empty" }, [el("strong", { text: title }), text]); }
    function stepper(initial, label) {
        var input = el("input", { type: "number", min: "1", max: "100000", step: "1", inputmode: "numeric", value: String(initial), "aria-label": label || "Quantity" });
        function bump(delta) { var n = parseInt(input.value, 10); input.value = String(Math.max(1, Math.min(100000, (isNaN(n) ? 1 : n) + delta))); input.dispatchEvent(new Event("change")); }
        var box = el("div", { class: "stepper" }, [el("button", { type: "button", text: "−", "aria-label": "One less", onclick: function () { bump(-1); } }), input,
            el("button", { type: "button", text: "+", "aria-label": "One more", onclick: function () { bump(1); } })]);
        return { box: box, input: input };
    }
    function addToListControls(row) {
        var qty = stepper(row.suggested_qty, "Quantity to order");
        var button = el("button", { type: "button", class: row.on_order_list ? "good" : "primary", text: row.on_order_list ? "✓ On list - update" : "Add to order list" });
        button.addEventListener("click", async function () {
            button.disabled = true;
            var result = await send("/draft", { action: "add", item_name: row.item_name, qty: parseInt(qty.input.value, 10) });
            button.disabled = false;
            if (result.ok) { say(row.item_name + " is on the order list."); button.textContent = "✓ On list - update"; button.className = "good"; refreshCounts(); }
            else { say(result.data.error || "Could not add.", true); }
        });
        return el("div", { class: "actions" }, [qty.box, button]);
    }
    function orderChip(order) { return order ? chip("Ordered " + when(order.ordered_on), "plain") : null; }

    // ---------------- needs restocking
    function lowCard(row) {
        var urgent = row.days_left !== null && row.days_left <= 3 || row.qty === 0;
        var soon = !urgent;
        var chips = [chip(row.qty + " in stock", row.qty <= 2 ? "bad" : "plain")];
        if (row.no_recent_sales) { chips.push(chip("no recent sales", "plain")); }
        else {
            chips.push(chip("selling " + row.speed + " a day", "plain"));
            if (row.days_left !== null) { chips.push(chip("about " + row.days_left + (row.days_left === 1 ? " day" : " days") + " left", urgent ? "bad" : "warn")); }
        }
        chips.push(orderChip(row.open_order));
        return el("div", { class: "card " + (urgent ? "urgent" : soon ? "soon" : "") + (row.open_order ? " dim" : "") }, [
            el("div", { class: "top" }, [el("div", { class: "name", text: row.item_name })]),
            el("div", { class: "chips" }, chips), addToListControls(row)]);
    }
    function outCard(row) {
        var chips = [chip("out of stock", "bad"), chip(row.speed > 0 ? "was selling " + row.speed + " a day" : "no recent sales", "plain"), orderChip(row.open_order)];
        return el("div", { class: "card urgent" + (row.open_order ? " dim" : "") }, [
            el("div", { class: "top" }, [el("div", { class: "name", text: row.item_name })]),
            el("div", { class: "chips" }, chips), addToListControls(row)]);
    }
    async function renderNeeds() {
        var s = ui.needs;
        var parts = await Promise.all([getData({ tab: "needs", section: "low", page: s.lowPage }),
            getData({ tab: "needs", section: "out", page: s.outPage, q: s.q, show_all: s.showAll ? 1 : 0 })]);
        var low = parts[0], out = parts[1];
        setBanner(low.tracking);
        var settings = low.settings, fields = {};
        function numberField(key, label, min, max) {
            fields[key] = el("input", { type: "number", min: String(min), max: String(max), step: "1", inputmode: "numeric", value: String(settings[key]) });
            return el("label", {}, [label, fields[key]]);
        }
        var settingsBox = el("details", { class: "settings" }, [el("summary", { text: "Settings" }), el("div", { class: "fields" }, [
            numberField("low_days", "Warn when days left is at most", 1, 365), numberField("low_qty", "Or when quantity is at most", 0, 1000),
            numberField("order_cover_days", "Order enough for (days)", 1, 365)]),
            el("div", { class: "actions", style: "margin:0 0 12px" }, [el("button", { type: "button", class: "primary", text: "Save settings", onclick: async function () {
                var body = {};
                Object.keys(fields).forEach(function (k) { body[k] = parseInt(fields[k].value, 10); });
                var result = await send("/settings", body);
                if (result.ok) { say("Settings saved."); load(); } else { say(result.data.error || "Could not save.", true); }
            } })])]);
        var lowSection = el("div", { class: "section" }, [el("h2", {}, ["Running low ", el("small", { text: String(low.total) })]),
            el("div", { class: "hint", text: "Days left is an estimate from how fast the stock went down." })]);
        if (!low.rows.length) { lowSection.appendChild(emptyState("Nothing is running low", "Everything has enough stock for now.")); }
        low.rows.forEach(function (row) { lowSection.appendChild(lowCard(row)); });
        var lowMore = moreButton(low, function () { s.lowPage += 1; load(); });
        if (lowMore) { lowSection.appendChild(lowMore); }

        var toggle = el("input", { type: "checkbox" });
        toggle.checked = s.showAll;
        toggle.addEventListener("change", function () { s.showAll = toggle.checked; s.outPage = 1; load(); });
        var outSection = el("div", { class: "section" }, [el("h2", {}, ["Out of stock ", el("small", { text: String(out.total) })]),
            el("div", { class: "toolbar" }, [el("label", {}, [toggle, "Show the whole catalogue"])]),
            searchBox(s.q, function (value) { s.q = value; s.outPage = 1; load(); })]);
        if (!out.rows.length) { outSection.appendChild(emptyState(s.showAll || s.q ? "No items found" : "Nothing out of stock needs attention", s.showAll || s.q ? "Try a different search." : "Sold-out items show here once they have sold before.")); }
        out.rows.forEach(function (row) { outSection.appendChild(outCard(row)); });
        var outMore = moreButton(out, function () { s.outPage += 1; load(); });
        if (outMore) { outSection.appendChild(outMore); }
        panel.replaceChildren(settingsBox, lowSection, outSection);
    }

    // ---------------- order list
    function showCopyBox(text) {
        var area = el("textarea", { class: "copybox", readonly: true, "aria-label": "Order list text" });
        area.value = text;
        panel.insertBefore(el("div", { class: "section" }, [el("div", { class: "hint", text: "Select all the text below, then copy it." }), area]), panel.firstChild);
        area.focus(); area.select();
    }
    async function copyText(text) {
        try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); say("Copied. You can paste it into WhatsApp."); return; } }
        catch (error) { /* fall through to the older way */ }
        var scratch = el("textarea", { readonly: true, style: "position:fixed;top:0;left:0;opacity:0" });
        scratch.value = text;
        document.body.appendChild(scratch);
        scratch.select(); scratch.setSelectionRange(0, text.length);
        var copied = false;
        try { copied = document.execCommand("copy"); } catch (error) { copied = false; }
        document.body.removeChild(scratch);
        if (copied) { say("Copied. You can paste it into WhatsApp."); } else { showCopyBox(text); say("Could not copy by itself. Select the text and copy it.", true); }
    }
    async function placeOrders(body) {
        var result = await send("/orders", Object.assign({ action: "place" }, body));
        if (result.status === 409 && result.data.needs_confirm) {
            if (window.confirm("These items already have an open order:\n" + (result.data.duplicates || []).join(", ") + "\n\nOrder them again?")) {
                result = await send("/orders", Object.assign({ action: "place", confirm_duplicates: true }, body));
            } else { return; }
        }
        if (result.ok) { say("Marked as ordered."); load(); } else { say(result.data.error || "Could not mark as ordered.", true); }
    }
    async function undo() {
        var result = await send("/orders", { action: "undo" });
        if (result.ok) { say("Undone."); load(); } else { say(result.data.error || "Nothing to undo.", true); }
    }
    async function renderOrder() {
        var data = await getData({ tab: "order" });
        setBanner(data.tracking);
        document.getElementById("printSheet").textContent = data.text || "";
        var expected = el("input", { type: "date", min: "2020-01-01", "aria-label": "Expected date" });
        var ticks = {};
        var parts = [];
        parts.push(el("div", { class: "bar" }, [
            el("div", { class: "grow" }, [el("strong", { text: data.total_items + (data.total_items === 1 ? " item" : " items") + " to order" })]),
            el("button", { type: "button", text: "Copy as text", disabled: !data.total_items, onclick: function () { copyText(data.text); } }),
            el("button", { type: "button", text: "Print", disabled: !data.total_items, onclick: function () { window.print(); } }),
            el("button", { type: "button", class: "ghost", text: "Undo", disabled: !data.can_undo, onclick: undo })]));
        if (!data.total_items) {
            parts.push(emptyState("The order list is empty", "Add items from Needs restocking."));
        } else {
            parts.push(el("div", { class: "bar" }, [el("label", {}, ["Expected date (optional) ", expected]),
                el("div", { class: "grow" }),
                el("button", { type: "button", text: "Mark ticked as ordered", onclick: function () {
                    var keys = Object.keys(ticks).filter(function (k) { return ticks[k].checked; });
                    if (!keys.length) { say("Tick the items first.", true); return; }
                    placeOrders({ item_keys: keys, expected_date: expected.value || null }); } }),
                el("button", { type: "button", class: "primary", text: "Mark all as ordered", onclick: function () { placeOrders({ all: true, expected_date: expected.value || null }); } })]));
        }
        data.groups.forEach(function (group) {
            parts.push(el("div", { class: "group-title", text: group.name }));
            group.items.forEach(function (item) {
                var tick = el("input", { type: "checkbox", "aria-label": "Tick " + item.item_name });
                ticks[item.item_key] = tick;
                var qty = stepper(item.qty, "Quantity");
                qty.input.addEventListener("change", async function () {
                    var result = await send("/draft", { action: "update", item_key: item.item_key, qty: parseInt(qty.input.value, 10) });
                    if (result.ok) { say("Saved."); } else { say(result.data.error || "Could not save.", true); load(); }
                });
                var note = el("input", { type: "text", class: "wide", maxlength: "200", value: item.note, placeholder: "Note (optional)", "aria-label": "Note" });
                note.addEventListener("change", async function () {
                    var result = await send("/draft", { action: "update", item_key: item.item_key, note: note.value });
                    if (result.ok) { say("Saved."); } else { say(result.data.error || "Could not save.", true); }
                });
                parts.push(el("div", { class: "card" }, [
                    el("div", { class: "top" }, [tick, el("div", { class: "name", text: item.item_name })]),
                    item.has_open_order ? el("div", { class: "chips" }, [chip("already has an open order", "warn")]) : null,
                    el("div", { class: "actions" }, [qty.box, el("div", { class: "grow" }), el("button", { type: "button", class: "danger", text: "Remove", onclick: async function () {
                        var result = await send("/draft", { action: "remove", item_key: item.item_key });
                        if (result.ok) { load(); } else { say(result.data.error || "Could not remove.", true); }
                    } })]),
                    el("div", { class: "actions" }, [note])]));
            });
        });
        panel.replaceChildren.apply(panel, parts);
    }

    // ---------------- ordered
    async function renderOrdered() {
        var data = await getData({ tab: "ordered", page: ui.ordered.page });
        setBanner(data.tracking);
        var parts = [el("div", { class: "bar" }, [el("div", { class: "grow" }, [el("strong", { text: data.total + (data.total === 1 ? " open order" : " open orders") }),
            el("div", { class: "meta", text: "An order is marked received by itself when its stock goes up." })]),
            el("button", { type: "button", class: "ghost", text: "Undo", disabled: !data.can_undo, onclick: undo })])];
        if (!data.open.length) { parts.push(emptyState("No open orders", "Orders you mark as ordered will show here.")); }
        data.open.forEach(function (order) {
            var date = el("input", { type: "date", min: "2020-01-01", value: order.expected_date || "", "aria-label": "Expected date" });
            var received = stepper(order.qty_ordered, "Quantity received");
            var act = async function (body, done) {
                var result = await send("/orders", body);
                if (result.ok) { say(done); load(); } else { say(result.data.error || "Could not save.", true); }
            };
            var age = order.age_days === 0 ? "today" : order.age_days + (order.age_days === 1 ? " day ago" : " days ago");
            var chips = [chip("ordered " + age, "plain"), order.expected_date ? chip("expected " + when(order.expected_date), order.overdue ? "bad" : "plain") : null, order.overdue ? chip("Overdue", "bad") : null];
            parts.push(el("div", { class: "card " + (order.overdue ? "urgent" : "fine") }, [
                el("div", { class: "top" }, [el("div", { class: "name", text: order.item_name + " × " + order.qty_ordered })]),
                el("div", { class: "chips" }, chips),
                order.note ? el("div", { class: "meta", text: order.note }) : null,
                el("div", { class: "actions" }, [received.box, el("button", { type: "button", class: "primary", text: "Mark received", onclick: function () {
                    act({ action: "receive", id: order.id, qty_received: parseInt(received.input.value, 10) }, "Marked as received."); } })]),
                el("div", { class: "actions" }, [date, el("button", { type: "button", text: "Save date", onclick: function () {
                    act({ action: "expected", id: order.id, expected_date: date.value || null }, "Date saved."); } }),
                    el("div", { class: "grow" }),
                    el("button", { type: "button", class: "danger", text: "Cancel order", onclick: function () {
                        if (window.confirm("Cancel the order for " + order.item_name + "?")) { act({ action: "cancel", id: order.id }, "Order cancelled."); } } })])]));
        });
        var more = moreButton(data, function () { ui.ordered.page += 1; load(); });
        if (more) { parts.push(more); }
        parts.push(el("div", { class: "group-title", text: "Received in the last 30 days" }));
        if (!data.recent.length) { parts.push(el("div", { class: "hint", text: "Nothing received yet." })); }
        data.recent.forEach(function (order) {
            parts.push(el("div", { class: "card fine" }, [el("div", { class: "name", text: order.item_name }),
                el("div", { class: "meta", text: "Received " + when(order.received_on) + " · " + order.qty_received + " (ordered " + order.qty_ordered + ")" })]));
        });
        panel.replaceChildren.apply(panel, parts);
    }

    // ---------------- slow stock
    async function renderSlow() {
        var s = ui.slow;
        var data = await getData({ tab: "slow", days: s.days, q: s.q, page: s.page });
        setBanner(data.tracking);
        var select = el("select", { "aria-label": "Days without a sale" }, [el("option", { value: "60", text: "60 days" }), el("option", { value: "90", text: "90 days" })]);
        select.value = String(s.days);
        select.addEventListener("change", function () { s.days = parseInt(select.value, 10); s.page = 1; load(); });
        var parts = [el("div", { class: "bar" }, [el("label", {}, ["In stock, nothing sold for ", select])])];
        if (data.insufficient_history) {
            parts.push(emptyState("Not enough history yet", data.message));
        } else {
            parts.push(el("div", { class: "section" }, [el("h2", {}, ["Slow stock ", el("small", { text: String(data.total) })]), searchBox(s.q, function (value) { s.q = value; s.page = 1; load(); })]));
            if (!data.rows.length) { parts.push(emptyState("No slow items", "Everything in stock has sold recently.")); }
            data.rows.forEach(function (row) {
                parts.push(el("div", { class: "card soon" }, [el("div", { class: "name", text: row.item_name }),
                    el("div", { class: "chips" }, [chip(row.qty + " in stock", "plain"), chip("sitting " + row.days_sitting + " days", "warn"),
                        chip(row.last_decrease ? "last sold " + when(row.last_decrease) : "no sale since tracking began", "plain")])]));
            });
            var more = moreButton(data, function () { s.page += 1; load(); });
            if (more) { parts.push(more); }
        }
        panel.replaceChildren.apply(panel, parts);
    }

    var renderers = { needs: renderNeeds, order: renderOrder, ordered: renderOrdered, slow: renderSlow };
    async function load() {
        var ticket = ++loadCount;
        if (!panel.firstChild) { panel.appendChild(el("div", { class: "loading", text: "Loading…" })); }
        try {
            await renderers[current]();
            if (ticket === loadCount) { quiet(); }
            refreshCounts();
        } catch (error) {
            say(error.message || "Could not load. Please try again.", true);
        }
    }
    function select(tab) {
        current = tab;
        Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (button) {
            button.setAttribute("aria-selected", button.getAttribute("data-tab") === tab ? "true" : "false");
        });
        try { window.location.hash = tab; } catch (error) { /* ignore */ }
        panel.replaceChildren();
        window.scrollTo(0, 0);
        load();
    }
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (button) {
        button.addEventListener("click", function () { select(button.getAttribute("data-tab")); });
    });
    document.getElementById("refreshBtn").addEventListener("click", function () { load(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) { load(); } });
    var start = (window.location.hash || "").replace("#", "");
    select(tabNames.indexOf(start) >= 0 ? start : "needs");
})();
</script>
</body>
</html>
